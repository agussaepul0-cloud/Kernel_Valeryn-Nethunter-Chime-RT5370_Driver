name: Kernel_Valeryn-Nethunter-Chime-RT5370_Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git ccache zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Kernel Source & Toolchain
        run: |
          git clone https://github.com/crdroidandroid/android_kernel_xiaomi_chime --depth=1 kernel
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Configure & Build Kernel
        run: |
          cd kernel

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          MAKE_ARGS=(
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )

          # Clean Output Directory
          rm -rf out
          mkdir -p out

          # 1. Load Defconfig
          make O=out "${MAKE_ARGS[@]}" vendor/bengal-perf_defconfig

          # --- KOREKSI DIGITAL GAIN AUDIO SPEAKER (PANGKAS 50%) ---
          if [ -d sound/soc/codecs ]; then
            find sound/soc/codecs/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/max_val = 128/max_val = 64/g' {} + 2>/dev/null || true
          fi
          if [ -d techpack/audio ]; then
            find techpack/audio/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/AMP_GAIN_DEFAULT 0x7FFF/AMP_GAIN_DEFAULT 0x3FFF/g' {} + 2>/dev/null || true
          fi
          # --------------------------------------------------------

          # 2. Configuration Injection for NetHunter & Driver RT5370
          scripts/config --file out/.config --enable CONFIG_NET
          scripts/config --file out/.config --enable CONFIG_WIRELESS
          scripts/config --file out/.config --enable CONFIG_WLAN
          scripts/config --file out/.config --enable CONFIG_NET_RADIO
          scripts/config --file out/.config --enable CONFIG_CFG80211
          scripts/config --file out/.config --enable CONFIG_MAC80211
          scripts/config --file out/.config --enable CONFIG_MAC80211_LEDS
          scripts/config --file out/.config --enable CONFIG_MAC80211_MESH
          scripts/config --file out/.config --enable CONFIG_PACKET
          scripts/config --file out/.config --enable CONFIG_NL80211_TESTMODE
          scripts/config --file out/.config --enable CONFIG_CFG80211_INTERNAL_REGDB
          scripts/config --file out/.config --enable CONFIG_CFG80211_CERTIFICATION_ONUS
          scripts/config --file out/.config --disable CONFIG_CFG80211_REQUIRE_SIGNED_REGDB

          # USB OTG & Firmware Loading
          scripts/config --file out/.config --enable CONFIG_FW_LOADER
          scripts/config --file out/.config --enable CONFIG_EXTRA_FIRMWARE
          scripts/config --file out/.config --enable CONFIG_USB_OTG
          scripts/config --file out/.config --enable CONFIG_USB_MON

          # HID & Tunneling
          scripts/config --file out/.config --enable CONFIG_TUN
          scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_HID
          scripts/config --file out/.config --enable CONFIG_USB_F_HID

          # Driver RT5370 (Ralink)
          scripts/config --file out/.config --enable CONFIG_STAGING
          scripts/config --file out/.config --enable CONFIG_USB_SUPPORT
          scripts/config --file out/.config --enable CONFIG_USB
          scripts/config --file out/.config --enable CONFIG_USB_NET_DRIVERS
          scripts/config --file out/.config --enable CONFIG_RT2X00
          scripts/config --file out/.config --enable CONFIG_RT2800USB
          scripts/config --file out/.config --enable CONFIG_RT2800USB_RT33XX
          scripts/config --file out/.config --enable CONFIG_RT2800USB_RT35XX
          scripts/config --file out/.config --enable CONFIG_RT2800USB_RT53XX
          scripts/config --file out/.config --enable CONFIG_RT2800USB_UNKNOWN
          scripts/config --file out/.config --enable CONFIG_RT2X00_LIB_USB
          scripts/config --file out/.config --enable CONFIG_RT2X00_LIB_FIRMWARE
          scripts/config --file out/.config --enable CONFIG_RT2X00_LIB_CRYPTO

          # DT2W Support
          scripts/config --file out/.config --enable CONFIG_TOUCHSCREEN_DOUBLE_TAP

          # 3. Update Defconfig
          make O=out "${MAKE_ARGS[@]}" olddefconfig

          # 4. Build Kernel Image & DTB
          make -j$(nproc --all) O=out "${MAKE_ARGS[@]}" Image dtbs dtbo.img || make -j$(nproc --all) O=out "${MAKE_ARGS[@]}" Image

      - name: Repack Installer AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3

          # Copy Kernel Image
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          else
            echo "Error: Image file not found!" && exit 1
          fi

          # Copy DTB & DTBO
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img AnyKernel3/dtb
          elif [ -f kernel/out/arch/arm64/boot/dtb ]; then
            cp kernel/out/arch/arm64/boot/dtb AnyKernel3/dtb
          elif [ -f kernel/out/arch/arm64/boot/dts/vendor/qcom/bengal.dtb ]; then
            cp kernel/out/arch/arm64/boot/dts/vendor/qcom/bengal.dtb AnyKernel3/dtb
          fi

          [ -f kernel/out/arch/arm64/boot/dtbo.img ] && cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img

          cd AnyKernel3

          # Membuat anykernel.sh dengan path blok eksplisit untuk Redmi 9T (Chime)
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Setup
          properties() { '
          kernel.string=Valeryn Kernel - NetHunter Chime
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; }

          # Path blok eksplisit agar TWRP tidak gagal mendeteksi partisi boot
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          # Flash Process
          dump_boot;

          if [ -f /tmp/anykernel/dtb ]; then
            cp /tmp/anykernel/dtb /tmp/anykernel/split_img/dtb;
          fi;

          write_boot;
          EOF

          chmod -R 755 tools/
          zip -r9 Kernel_Valeryn-Nethunter-Chime-RT5370_Driver.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Valeryn-Nethunter-Chime-RT5370_Driver
          path: AnyKernel3/Kernel_Valeryn-Nethunter-Chime-RT5370_Driver.zip
